name: Morning summary

on:
  schedule:
    # Many attempts at off-peak minutes: GitHub delays — and under load drops — scheduled
    # runs, especially at :00. 04:07–07:47 UTC = 06:07–10:47 Israel time (DST-dependent).
    # The script sends once a day, on the first run at/after 07:00 Israel time; the other
    # runs just exit (and keep the subscription calendar fresh).
    - cron: '7,27,47 4-7 * * *'
    # Moodle check every 2 hours during the day (≈ 08:37–22:37 Israel time).
    - cron: '37 6-20/2 * * *'
  # Manual / external trigger. By default sends the morning summary right away (testing).
  # An external scheduler (cron-job.org) dispatches with force=false: then the normal
  # "once a day, from 07:00" rule applies, so it never duplicates the morning summary.
  workflow_dispatch:
    inputs:
      force:
        description: 'Send the morning summary now (ignore the hour / once-a-day check)'
        type: boolean
        default: true
  push: # schedule data changed → refresh the subscription calendar only
    branches: [main]
    paths: ['semesters/**', 'calendar.js', 'schedule.js']

# The job only needs to read the repo; everything else uses its own secrets.
permissions:
  contents: read

# One run at a time: runs share the Panopto refresh token (which may be single-use).
concurrency:
  group: morning-job
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to exact commits (a tag can be moved; a commit can't)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # exact versions from package-lock.json (checked against their hashes), no install scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools/morning.mjs
        env:
          TZ: Asia/Jerusalem
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          MOODLE_ICS_URL: ${{ secrets.MOODLE_ICS_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PANOPTO_CLIENT_ID: ${{ secrets.PANOPTO_CLIENT_ID }}
          PANOPTO_CLIENT_SECRET: ${{ secrets.PANOPTO_CLIENT_SECRET }}
          PANOPTO_KEY: ${{ secrets.PANOPTO_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          EVENT: ${{ github.event_name }}
