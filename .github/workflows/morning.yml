name: Morning summary

on:
  schedule:
    # Many attempts at off-peak minutes: GitHub delays — and under load drops — scheduled
    # runs, especially at :00. 04:07–07:47 UTC = 06:07–10:47 Israel time (DST-dependent).
    # The script sends once a day, on the first run at/after 07:00 Israel time; the other
    # runs just exit (and keep the subscription calendar fresh).
    - cron: '7,27,47 4-7 * * *'
  workflow_dispatch: # "Run workflow" button: sends right away (for testing)
  push: # schedule data changed → refresh the subscription calendar only
    branches: [main]
    paths: ['semesters/**', 'calendar.js', 'schedule.js']

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save web-push@3
      - run: node tools/morning.mjs
        env:
          TZ: Asia/Jerusalem
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          EVENT: ${{ github.event_name }}
