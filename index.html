<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Matches the page background (--bg) so Chrome's own title-bar areas blend in. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5f9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111520">
  <script src="theme.js"></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="הסמסטרון">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>הסמסטרון</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <img class="brand-icon" src="icon-192.png" alt="" width="34" height="34">
      <div class="brand-text">
        <h1>הסמסטרון</h1>
        <div id="title" class="brand-sem"></div>
      </div>
    </div>
    <div class="header-actions">
      <button id="sync-chip" class="chip" data-action="sync"></button>
      <button class="icon-btn bell" data-action="inbox" title="עדכונים" aria-label="עדכונים מהמודל">🔔<span id="inbox-count" class="badge"></span></button>
      <button class="icon-btn" data-tab-link="settings" title="הגדרות" aria-label="הגדרות">⚙️</button>
    </div>
  </header>
  <nav>
    <button data-tab="todo">לעשות <span id="todo-count" class="badge"></span></button>
    <button data-tab="schedule">מערכת</button>
    <button data-tab="tasks">משימות <span id="task-count" class="badge"></span></button>
    <button data-tab="courses">בחינות ומידע</button>
  </nav>
  <main id="main"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
